# ── Server ────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── PostgreSQL (Supabase) ────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ── Flyway ────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── Redis (Upstash) ─────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# ── Kafka (Railway Internal) ──────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka.railway.internal:9092}

# ── S3 (AWS/Cloudflare) ────────────────────────────────────────────────
minio.endpoint=${S3_ENDPOINT:http://localhost:9000}
minio.access-key=${S3_ACCESS_KEY:dummy_access}
minio.secret-key=${S3_SECRET_KEY:dummy_secret}
minio.bucket-name=${S3_BUCKET_NAME:dummy-bucket}
minio.presigned-url-expiry-minutes=15

# ── Vault ─────────────────────────────────────────────────────────────────
spring.cloud.vault.token=${VAULT_TOKEN:dummy_token}
spring.cloud.vault.uri=${VAULT_URI:http://localhost:8200}

# ── JWT (Clerk OAuth2) ──────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:jb0Tc+vBb+Q98czX9QC3OMfpHZk3okPP4mV9lMFxnaA=}
jwt.vault-secret=${JWT_VAULT_SECRET:yMoR6NxW1wYi0YUfLFhIrJs/LHLOipUKKaJX0Ne0L1Q=}

# ── MSG91 ─────────────────────────────────────────────────────────────────
msg91.auth-key=${MSG91_AUTH_KEY:dummy_key}
msg91.sender-id=${MSG91_SENDER_ID:dummy_id}
msg91.template-id=${MSG91_TEMPLATE_ID:dummy_template}

# ── Firebase ──────────────────────────────────────────────────────────────

firebase.service-account-path=nidar-firebase-adminsdk.json


logging.level.com.nidar=INFO
