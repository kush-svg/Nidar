# ── Server ────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── PostgreSQL ────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:15432/nidar
spring.datasource.username=nidar_user
spring.datasource.password=kush123

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ── Flyway ────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── Memorystore Redis ─────────────────────────────────────────────────────
# spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# ── Kafka ─────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092

# ── MinIO (S3-compatible) ────────────────────────────────────────────────
minio.endpoint=http://localhost:9000
minio.access-key=nidar_minio_user
minio.secret-key=nidar_minio_password
minio.bucket-name=nidar-evidence-vault
minio.presigned-url-expiry-minutes=15

# ── JWT (Clerk OAuth2) ──────────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CLERK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLERK_ISSUER_URI}/.well-known/jwks.json

