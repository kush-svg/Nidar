# docker-compose.yml
version: '3.8'

services:

  redis:
    image: redis:7-alpine
    container_name: nidar-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass nidar_redis_pass
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: nidar-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: nidar-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=nidar_minio_user
      - MINIO_ROOT_PASSWORD=nidar_minio_password
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  vault:
    image: hashicorp/vault:latest
    container_name: nidar-vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=nidar-vault-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: nidar-postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: nidar
      POSTGRES_USER: nidar_user
      POSTGRES_PASSWORD: kush123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data: