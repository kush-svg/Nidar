# docker-compose.yml
version: '3.8'

services:

  redis:
    image: redis:7-alpine
    container_name: nidar-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass nidar_redis_pass
    restart: unless-stopped

  # kafka:
  #   image: bitnami/kafka:latest
  #   container_name: nidar-kafka
  #   ports:
  #     - "9092:9092"
  #   environment:
  #     - KAFKA_CFG_NODE_ID=0
  #     - KAFKA_CFG_PROCESS_ROLES=controller,broker
  #     - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
  #     - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  #     - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
  #     - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
  #   restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: nidar-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=nidar_minio_user
      - MINIO_ROOT_PASSWORD=nidar_minio_password
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  vault:
    image: hashicorp/vault:latest
    container_name: nidar-vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=nidar-vault-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    restart: unless-stopped

volumes:
  minio-data: